name: Build and Upload SBOMs to Dependency-Track

on:
  workflow_dispatch:
  push:
    branches:
      - '*'

env:
  FRONTEND_DIR: "./OurUmbraco.Client"
  TRACKER_ENDPOINT: "https://ca-live-global-dtrack-api.purplemoss-6e7d841c.westeurope.azurecontainerapps.io/api/v1/bom"

jobs:

  # ==========================================
  # BACKEND (.NET Framework) SBOM via Syft
  # ==========================================
  backend-sbom:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install CycloneDX CLI
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/CycloneDX/cyclonedx-cli/releases/latest"
      
          Write-Host "Available assets:"
          $release.assets | Select-Object name, browser_download_url | Format-List
      
          # Pick Windows x64 exe
          $asset = $release.assets | Where-Object { $_.name -eq "cyclonedx-win-x64.exe" }
      
          if (-not $asset) {
            Write-Error "Could not find Windows x64 CycloneDX executable."
            exit 1
          }
      
          $dest = "$HOME\cyclonedx-cli"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
      
          $exePath = Join-Path $dest "cyclonedx.exe"
      
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $exePath
      
          # Add to PATH
          echo "$dest" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      
          Write-Host "Installed CycloneDX CLI at $exePath"
          
      - name: Generate SBOM for .NET Framework project (source)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "sbom" | Out-Null
          $solution = Join-Path $PWD "our.umbraco.org.sln"
          $out = Join-Path $PWD "sbom/bom-dotnet-full.json"
      
          cyclonedx bom --project-file "$solution" --output-file "$out" --output-format json
      
          Write-Host "SBOM created at $out"

      - name: Upload source SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-dotnet-full
          path: sbom/bom-dotnet-full.json

  # ==========================================
  # FRONTEND (Node) SBOM
  # ==========================================
  frontend-sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install CycloneDX Node.js CLI in frontend
        run: |
          if [ -f "$FRONTEND_DIR/package.json" ]; then
            cd "$FRONTEND_DIR"
            npm install --save-dev @cyclonedx/cyclonedx-npm
          else
            echo "No package.json found in $FRONTEND_DIR"
          fi

      - name: Generate SBOM for Node.js (frontend)
        run: |
          mkdir -p sbom
          if [ -f "$FRONTEND_DIR/package-lock.json" ] || [ -f "$FRONTEND_DIR/yarn.lock" ]; then
            cd "$FRONTEND_DIR"
            npx @cyclonedx/cyclonedx-npm -o ../sbom/bom-frontend.json
          else
            echo "No lockfile found — skipping frontend SBOM"
          fi

      - name: Upload frontend SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-frontend
          path: sbom/bom-frontend.json


  # ==========================================
  # UPLOAD TO DEPENDENCY-TRACK
  # ==========================================
  upload:
    needs:
      - frontend-sbom
      - backend-sbom
    runs-on: ubuntu-latest
    steps:

      - name: Download .NET SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom-dotnet
          path: sboms/dotnet

      - name: Download frontend SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom-frontend
          path: sboms/frontend


      - name: Upload .NET SBOM to Dependency-Track
        env:
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
        run: |
          curl --fail-with-body -v -i -w "\nHTTP Status: %{http_code}\n" \
            -X POST "$TRACKER_ENDPOINT" \
            -H "X-Api-Key: $DTRACK_API_KEY" \
            -H "accept: application/json" \
            -H "Content-Type: multipart/form-data" \
            -F "autoCreate=true" \
            -F "projectName=${{ github.event.repository.name }}-backend" \
            -F "projectVersion=${{ github.ref_name }}" \
            -F "bom=@sboms/dotnet/bom-dotnet-full.json"

      - name: Upload Node.js SBOM to Dependency-Track
        env:
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
        run: |
          if [ -f sboms/frontend/bom-frontend.json ]; then
            curl --fail-with-body -v -i -w "\nHTTP Status: %{http_code}\n" \
              -X POST "$TRACKER_ENDPOINT" \
              -H "X-Api-Key: $DTRACK_API_KEY" \
              -H "accept: application/json" \
              -H "Content-Type: multipart/form-data" \
              -F "autoCreate=true" \
              -F "projectName=${{ github.event.repository.name }}-frontend" \
              -F "projectVersion=${{ github.ref_name }}" \
              -F "bom=@sboms/frontend/bom-frontend.json"
          else
            echo "No frontend SBOM to upload."
          fi
