name: Build and Upload SBOMs to Dependency-Track

on:
  workflow_dispatch:
  push:
    branches:
      - '*'

env:
  FRONTEND_DIR: "./OurUmbraco.Client"
  TRACKER_ENDPOINT: "https://ca-live-global-dtrack-api.purplemoss-6e7d841c.westeurope.azurecontainerapps.io/api/v1/bom"

jobs:
  backend-sbom:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # .NET SBOM
      - name: Restore NuGet packages
        run: nuget restore ./our.umbraco.org.sln
        
      - name: Install CycloneDX for .NET
        run: dotnet tool install --global CycloneDX

      - name: Generate SBOM for .NET
        run: |
          New-Item -ItemType Directory -Force -Path "./sbom" | Out-Null

          $solution = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
          if ($solution) {
            $target = $solution.FullName
          } else {
            $project = Get-ChildItem -Recurse -Include *.csproj,*.vbproj,*.fsproj | Select-Object -First 1
            if ($project) {
              $target = $project.FullName
            } else {
              Write-Error "No solution or project found!"
              exit 1
            }
          }

          Write-Host "Generating SBOM for $target"
          dotnet-CycloneDX "$TARGET_FILE" --output ./sbom --filename bom-dotnet.xml --output-format Xml --enable-github-licenses --github-bearer-token ${{ secrets.GITHUB_TOKEN }}

  frontend-sbom:
    runs-on: ubuntu-latest

    steps:
      # Node.js SBOM
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install CycloneDX Node.js CLI in frontend
        run: |
          if [ -f "$FRONTEND_DIR/package.json" ]; then
            cd "$FRONTEND_DIR"
            npm install --save-dev @cyclonedx/cyclonedx-npm
          else
            echo "No package.json found in $FRONTEND_DIR, skipping CycloneDX install."
          fi

      - name: Generate SBOM for Node.js (frontend)
        run: |
          if [ -f "$FRONTEND_DIR/package-lock.json" ] || [ -f "$FRONTEND_DIR/yarn.lock" ]; then
            cd "$FRONTEND_DIR"
            npx @cyclonedx/cyclonedx-npm -o ../../sbom/bom-frontend.xml
          else
            echo "No package-lock.json or yarn.lock found in $FRONTEND_DIR, skipping frontend SBOM."
          fi
          
  upload:
    needs:
      - frontend-sbom
      - backend-sbom
    runs-on: ubuntu-latest
    steps:          
      # Upload .NET SBOM
      - name: Upload .NET SBOM to Dependency-Track
        env:
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
        run: |
          curl --fail-with-body -v -i -w "\nHTTP Status: %{http_code}\n" \
            -X POST "$TRACKER_ENDPOINT" \
            -H "X-Api-Key: $DTRACK_API_KEY" \
            -H "accept: application/json" \
            -H "Content-Type: multipart/form-data" \
            -F "autoCreate=true" \
            -F "projectName=${{ github.event.repository.name }}-backend" \
            -F "projectVersion=${{ github.ref_name }}" \
            -F "bom=@./sbom/bom-dotnet.xml"

      # Upload Node.js SBOM (if exists)
      - name: Upload Node.js SBOM to Dependency-Track
        env:
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
        run: |
          if [ -f ./sbom/bom-frontend.xml ]; then
            curl --fail-with-body -v -i -w "\nHTTP Status: %{http_code}\n" \
              -X POST "$TRACKER_ENDPOINT" \
              -H "X-Api-Key: $DTRACK_API_KEY" \
              -H "accept: application/json" \
              -H "Content-Type: multipart/form-data" \
              -F "autoCreate=true" \
              -F "projectName=${{ github.event.repository.name }}-frontend" \
              -F "projectVersion=${{ github.ref_name }}" \
              -F "bom=@./sbom/bom-frontend.xml"
          else
            echo "No frontend SBOM to upload."
          fi
